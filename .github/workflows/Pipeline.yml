name: Build, Package and Test GHDL

on:
  push:
  pull_request:
  workflow_dispatch:

# A push and its pull-request run the same pipeline, so both share a group and the older one is canceled.
# 'master' and tags are excluded: a release run must not be aborted by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref_name != 'master' }}

jobs:
# Windows Standalone - ZIP
#   UCRT64 - llvm

# pyGHDL wheel
#   macOS
#     Python 3.11
#     Python 3.12
#     Python 3.13
#     Python 3.14
#     Python 3.15
#     Python 3.16

# cleanups
#   libghdl-
#   pyGHDL-Coverage-
#   pyGHDL-Unittesting-
#   pyGHDL-typing-

# after PyPI upload
#   pyGHDL-Windows-
#   pyGHDL-Ubuntu-

  Params:
    uses: ./.github/workflows/Parameters.yml
    with:
      main_branch:    'master'
      release_branch: 'master'
      package_name:   'ghdl'
      library_name:   'libghdl'
      pyghdl_name:    'pyGHDL'
#      testsuites:     'sanity'         # disable parameter to fall back to 'all'

  macOS:
    uses: ./.github/workflows/Build-MacOS.yml
    needs:
      - Params
    strategy:
      fail-fast: false
      matrix:
        include:
# macOS-26 is the latest ARM release
###       - {icon: '🍏🟩', backend: 'mcode',    macos_image: 'macos-15', gnat_arch: 'aarch64', gnat_version: '16.1.0-1', testsuites: 'none'}                                    # mcode not yet supported for aarch64
          - {icon: '🍏🟩', backend: 'llvm',     macos_image: 'macos-15', gnat_arch: 'aarch64', gnat_version: '16.1.0-1', testsuites: '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
          - {icon: '🍏🟩', backend: 'llvm-jit', macos_image: 'macos-15', gnat_arch: 'aarch64', gnat_version: '16.1.0-1', testsuites: '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
###       - {icon: '🍏🟩', backend: 'mcode',    macos_image: 'macos-26', gnat_arch: 'aarch64', gnat_version: '16.1.0-1', testsuites: 'none'}                                    # mcode not yet supported for aarch64
          - {icon: '🍏🟩', backend: 'llvm',     macos_image: 'macos-26', gnat_arch: 'aarch64', gnat_version: '16.1.0-1', testsuites: '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
          - {icon: '🍏🟩', backend: 'llvm-jit', macos_image: 'macos-26', gnat_arch: 'aarch64', gnat_version: '16.1.0-1', testsuites: '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
    with:
      macos_image:              ${{ matrix.macos_image }}
      gnat_arch:                ${{ matrix.gnat_arch }}
      gnat_version:             ${{ matrix.gnat_version }}
      backend:                  ${{ matrix.backend }}
      testsuites:               ${{ matrix.testsuites }}
      testsuite_xml_artifact:   'GHDL-Testsuite-XML'
      macos_artifact:           ${{ needs.Params.outputs.ghdl_basename }}-${{ matrix.macos_image }}-${{ matrix.gnat_arch }}
      pyunit_testsuites:        'testsuite/pyunit/libghdl testsuite/pyunit/lsp'
      unittest_xml_artifact:    'pyGHDL-Unittest-XML'
      coverage_sqlite_artifact: 'pyGHDL-Coverage-SQLite'
    secrets: inherit

  # "-fast" matrix jobs where split of, to enhance overall runtime.
  # dependent jobs (pyGHDL, documentation, etc.) are enabled earlier.
  Ubuntu-fast:
    uses: ./.github/workflows/Build-Ubuntu.yml
    needs:
      - Params
    strategy:
      fail-fast: false
      matrix:
        include:
          - {icon: '🐧🟧', backend: 'mcode',    ubuntu_version: '22.04', testsuites: '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
          - {icon: '🐧🟨', backend: 'mcode',    ubuntu_version: '24.04', testsuites: '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
          - {icon: '🐧🟩', backend: 'mcode',    ubuntu_version: '26.04', testsuites: '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
    with:
      ubuntu_version:           ${{ matrix.ubuntu_version }}
      ghdl_backend:             ${{ matrix.backend }}
      ghdl_version:             ${{ needs.Params.outputs.ghdl_version }}
      testsuites:               ${{ matrix.testsuites }}
      testsuite_xml_artifact:   'GHDL-Testsuite-XML'
      ubuntu_artifact:          ${{ needs.Params.outputs.ghdl_basename }}-ubuntu-${{ matrix.ubuntu_version }}-x86_64
      libghdl_artifact:         ${{ needs.Params.outputs.libghdl_basename }}-ubuntu-${{ matrix.ubuntu_version }}-x86_64
      pyunit_testsuites:        'testsuite/pyunit/libghdl testsuite/pyunit/lsp'
      unittest_xml_artifact:    'pyGHDL-Unittest-XML'
      coverage_sqlite_artifact: 'pyGHDL-Coverage-SQLite'
    secrets: inherit

  Ubuntu:
    uses: ./.github/workflows/Build-Ubuntu.yml
    needs:
      - Params
    strategy:
      fail-fast: false
      matrix:
        include:
###       - {'icon': '🐧🟧', 'backend': 'mcode',    'ubuntu_version': '22.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites     # used by Ubuntu-fast
          - {'icon': '🐧🟧', 'backend': 'llvm',     'ubuntu_version': '22.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
          - {'icon': '🐧🟧', 'backend': 'llvm-jit', 'ubuntu_version': '22.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
          - {'icon': '🐧🟧', 'backend': 'gcc',      'ubuntu_version': '22.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
###       - {'icon': '🐧🟨', 'backend': 'mcode',    'ubuntu_version': '24.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites     # used by Ubuntu-fast
          - {'icon': '🐧🟨', 'backend': 'llvm',     'ubuntu_version': '24.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
          - {'icon': '🐧🟨', 'backend': 'llvm-jit', 'ubuntu_version': '24.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
          - {'icon': '🐧🟨', 'backend': 'gcc',      'ubuntu_version': '24.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
###       - {'icon': '🐧🟩', 'backend': 'mcode',    'ubuntu_version': '26.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites     # used by Ubuntu-fast
          - {'icon': '🐧🟩', 'backend': 'llvm',     'ubuntu_version': '26.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
          - {'icon': '🐧🟩', 'backend': 'llvm-jit', 'ubuntu_version': '26.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
          - {'icon': '🐧🟩', 'backend': 'gcc',      'ubuntu_version': '26.04', 'testsuites': '${{ needs.Params.outputs.testsuites }}'}  # 'all', 'none' or list of testsuites
    with:
      ubuntu_version:           ${{ matrix.ubuntu_version }}
      ghdl_backend:             ${{ matrix.backend }}
      ghdl_version:             ${{ needs.Params.outputs.ghdl_version }}
      testsuites:               ${{ matrix.testsuites }}
      testsuite_xml_artifact:   'GHDL-Testsuite-XML'
      ubuntu_artifact:          ${{ needs.Params.outputs.ghdl_basename }}-ubuntu-${{ matrix.ubuntu_version }}-x86_64
      libghdl_artifact:         ${{ needs.Params.outputs.libghdl_basename }}-ubuntu-${{ matrix.ubuntu_version }}-x86_64
      pyunit_testsuites:        'testsuite/pyunit/libghdl testsuite/pyunit/lsp'
      unittest_xml_artifact:    'pyGHDL-Unittest-XML'
      coverage_sqlite_artifact: 'pyGHDL-Coverage-SQLite'
    secrets: inherit

  # "-fast" matrix jobs where split of, to enhance overall runtime.
  # dependent jobs (pyGHDL, documentation, etc.) are enabled earlier.
  Windows-fast:
    uses: ./.github/workflows/Build-MSYS2.yml
    needs:
      - Params
    strategy:
      fail-fast: false
      matrix:
        include:
          - {icon: '🪟', runtime: 'ucrt64',  backend: 'mcode',    testsuites: '${{ needs.Params.outputs.testsuites }}'}
    with:
      runtime:                  ${{ matrix.runtime }}
      backend:                  ${{ matrix.backend }}
      testsuites:               ${{ matrix.testsuites }}
      testsuite_xml_artifact:   'GHDL-Testsuite-XML'
      msys2_artifact:           ${{ needs.Params.outputs.ghdl_basename }}-MSYS2
      pacman_artifact:          ${{ needs.Params.outputs.ghdl_basename }}-Pacman
      windows_artifact:         ${{ needs.Params.outputs.ghdl_basename }}-Windows
      libghdl_artifact:         ${{ needs.Params.outputs.libghdl_basename }}-MSYS2
      pyunit_testsuites:        'testsuite/pyunit/libghdl testsuite/pyunit/lsp'
      unittest_xml_artifact:    'pyGHDL-Unittest-XML'
      coverage_sqlite_artifact: 'pyGHDL-Coverage-SQLite'
    secrets: inherit

  Windows:
    uses: ./.github/workflows/Build-MSYS2.yml
    needs:
      - Params
    strategy:
      fail-fast: false
      matrix:
        include:
###       - {icon: '🪟', runtime: 'ucrt64',  backend: 'mcode',    testsuites: '${{ needs.Params.outputs.testsuites }}'}   # used by Windows-fast
          - {icon: '🪟', runtime: 'ucrt64',  backend: 'llvm',     testsuites: 'sanity gna synth vpi vhpi'}                # no vests (too slow)
          - {icon: '🪟', runtime: 'ucrt64',  backend: 'llvm-jit', testsuites: 'sanity gna synth vpi vhpi'}                # no vests (too slow)
    with:
      runtime:                  ${{ matrix.runtime }}
      backend:                  ${{ matrix.backend }}
      testsuites:               ${{ matrix.testsuites }}
      testsuite_xml_artifact:   'GHDL-Testsuite-XML'
      msys2_artifact:           ${{ needs.Params.outputs.ghdl_basename }}-MSYS2
      pacman_artifact:          ${{ needs.Params.outputs.ghdl_basename }}-Pacman
      windows_artifact:         ${{ needs.Params.outputs.ghdl_basename }}-Windows
      libghdl_artifact:         ${{ needs.Params.outputs.libghdl_basename }}-MSYS2
      pyunit_testsuites:        'testsuite/pyunit/libghdl testsuite/pyunit/lsp'
      unittest_xml_artifact:    'pyGHDL-Unittest-XML'
      coverage_sqlite_artifact: 'pyGHDL-Coverage-SQLite'
    secrets: inherit

  Python:
    uses: ./.github/workflows/Check-pyGHDL.yml
    needs:
      - Params

  StaticTypeCheck:
    uses: pyTooling/Actions/.github/workflows/StaticTypeCheck.yml@r9
    needs:
      - Params
    with:
      requirements:   mypy lxml
      html_artifact: 'pyGHDL-typing-HTML'

  DocCoverage:
    uses: pyTooling/Actions/.github/workflows/CheckDocumentation.yml@r9
    needs:
      - Params
    with:
      directory: pyGHDL

  pyGHDL:
    uses: ./.github/workflows/Package-pyGHDL.yml
    needs:
      - Params
      - Ubuntu-fast
      - Windows-fast
    strategy:
      fail-fast: false
      matrix:
        os:
          - {icon: '🐧', name: 'Ubuntu',  image: 'ubuntu-24.04', libgnat: '13', libghdl_artifact: 'ubuntu-24.04-x86_64', pyghdl_artifact: 'Ubuntu-24.04-x86_64'}  # build with an older Ubuntu 24.04, thus glibc 2.38 is used for manylinux_2_38 wheels
###       - {icon: '🍏', name: 'macOS',   image: 'macos-15',     libgnat: '',   libghdl_artifact: 'macos-15-aarch64',    pyghdl_artifact: 'macOS-15-aarch64'   }
          - {icon: '🪟', name: 'Windows', image: 'windows-2025', libgnat: '',   libghdl_artifact: 'MSYS2-ucrt64',        pyghdl_artifact: 'Windows-x86_64'     }
        py:
          - {icon: '🟠', version: '3.11'}
          - {icon: '🟡', version: '3.12'}
          - {icon: '🟢', version: '3.13'}
          - {icon: '🟢', version: '3.14'}
          - {icon: '🟢', version: '3.15'}
#         - {icon: '🟣', version: '3.16.0-alpha.1'}
        other:
          - {runtime: ''}
        include:
          - {os: {icon: '🪟🟨', name: 'Windows', image: 'windows-2025', libghdl_artifact: 'MSYS2-ucrt64',  pyghdl_artifact: 'Windows-ucrt64',  libgnat: ''}, py: {icon: '🟢', version: '3.14'}, other: {runtime: 'ucrt64' }}
    with:
      os_name:               ${{ matrix.os.name }}
      os_image:              ${{ matrix.os.image }}
      libgnat:               ${{ matrix.os.libgnat }}
      runtime:               ${{ matrix.other.runtime }}
      python_icon:           ${{ matrix.py.icon }}
      python_version:        ${{ matrix.py.version }}
      libghdl_artifact:      ${{ needs.Params.outputs.libghdl_basename }}-${{ matrix.os.libghdl_artifact }}
      pyghdl_artifact:       ${{ needs.Params.outputs.pyghdl_basename }}-${{ matrix.os.pyghdl_artifact }}-Python-${{ matrix.py.version }}
      pyghdl_version:        ${{ needs.Params.outputs.pyghdl_version }}
      # Ubuntu 24.04 wheels are also tested on Ubuntu 26.04 (Python 3.13 and newer)
      test_images:           ${{ (matrix.os.image == 'ubuntu-24.04' && contains(fromJson('["3.13", "3.14", "3.15"]'), matrix.py.version)) && '["ubuntu-24.04", "ubuntu-26.04"]' || '' }}
      unittest_xml_artifact: 'pyGHDL-Unittest-XML'
    secrets: inherit

  PublishTestsuiteResults:
    uses: pyTooling/Actions/.github/workflows/PublishTestResults.yml@r9
    needs:
      - macOS
      - Ubuntu
      - Ubuntu-fast
      - Windows
      - Windows-fast
    if: always()
    with:
      unittest_artifacts_pattern: 'GHDL-Testsuite-XML-*'
      merged_junit_artifact:      'GHDL-Unittest-XML-Premerged'
#      merged_junit_filename:      'GHDL-Testsuite.xml'
      merge-input-dialect:        'Any-JUnit'
      merge-output-dialect:       'pyTest-JUnit'
      additional_merge_args:      '-d "--render=tree"'
      dorny:                      false

  PublishPytestResults:
    uses: pyTooling/Actions/.github/workflows/PublishTestResults.yml@r9
    needs:
      - pyGHDL
      - PublishTestsuiteResults
    if: always()
    with:
      unittest_artifacts_pattern: '*-Unittest-XML-*'
      merged_junit_artifact:      'pyGHDL-Unittest-XML'
      additional_merge_args:      '-d "--render=tree" "--name=pyGHDL" "--pytest=rewrite-dunder-init;reduce-depth:pytest.testsuite.pyunit;split:pytest"'
      dorny:   true
#      codecov: true
#    secrets:
#      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  PublishCoverageResults:
    uses: pyTooling/Actions/.github/workflows/PublishCoverageResults.yml@r9
    needs:
      - macOS
      - Ubuntu-fast
      - Windows-fast
##   - pyGHDL         # pyGHDL is installed into site-packages, where no coverage is collected -> empty coverage report
    with:
      coverage_artifacts_pattern: '*-Coverage-SQLite-*'
      coverage_json_artifact: 'pyGHDL-Coverage-JSON'
      coverage_html_artifact: 'pyGHDL-Coverage-HTML'
#      codecov: true
#      codacy:  true
#    secrets:
#      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
#      CODACY_TOKEN:  ${{ secrets.CODACY_TOKEN }}

  IntermediateCleanUp:
    uses: pyTooling/Actions/.github/workflows/CleanupArtifacts.yml@r9
    needs:
      - PublishTestsuiteResults
      - PublishPytestResults
      - PublishCoverageResults
    with:
      others: |
        GHDL-Testsuite-XML-*
        pyGHDL-Coverage-SQLite-*
        pyGHDL-Unittest-XML-*

#  GNATdoc:
#    uses: ./.github/workflows/Documentation-GNAT.yml
#    with:
#      ubuntu_image:  "ubuntu-20.04"            # gnat-gps (incl. GNATdoc) is limited to Ubuntu 20.04
#      html_artifact: "documentation-gnatdoc"

  Sphinx:
    uses: ./.github/workflows/Documentation-Sphinx.yml
    needs:
      - Params
      - Ubuntu-fast
      - PublishCoverageResults
      - PublishPytestResults
    with:
      ghdl_artifact:  ${{ needs.Params.outputs.ghdl_basename }}-ubuntu-26.04-x86_64-mcode
      html_artifact:  'documentation-HTML'
      latex_document: 'ghdl'
      latex_artifact: 'documentation-LaTeX'
#      pdf_artifact:    'documentation-PDF'

  PublishToGitHubPages:
    uses: ./.github/workflows/Publish-GitHubPages.yml
    if: >-
      ${{ !failure() && !cancelled()
       && needs.Sphinx.result == 'success'
       && needs.PublishCoverageResults.result == 'success'
       && needs.StaticTypeCheck.result == 'success'
       && (needs.Params.outputs.on_main_branch == 'true'
        || needs.Params.outputs.is_release_tag == 'true'
        || needs.Params.outputs.is_nightly_tag == 'true'
        || needs.Params.outputs.is_test_tag == 'true'
        || startsWith(github.ref, format('refs/heads/{0}/', github.repository_owner))
       )
      }}
    needs:
      - Params
      - Sphinx
      - PublishCoverageResults
      - StaticTypeCheck
    with:
      documentation: 'documentation-HTML'
      coverage:      'pyGHDL-Coverage-HTML'
      typing:        'pyGHDL-typing-HTML'

  Nightly:
    uses: pyTooling/Actions/.github/workflows/PublishReleaseNotes.yml@r9
    if: >-
      ${{ !failure() && !cancelled()
       && (needs.Params.outputs.is_nightly_tag == 'true' || needs.Params.outputs.is_test_tag == 'true')
      }}
    needs:
      - Params
      - macOS
      - Ubuntu-fast
      - Ubuntu
      - Windows-fast
      - Windows
      - Python
      - Sphinx
    permissions:
      contents: write
      actions:  write
    with:
      tag:   ${{ needs.Params.outputs.tag }}
      title: 'Nightly Release'
      mode:  'nightly'
      description: |
        This *nightly* release contains all latest and important artifacts created by GHDL's CI pipeline.
      description_file: .github/ReleaseDescription.md
      prerelease: true
      replacements: |
        ghdl=${{ needs.Params.outputs.ghdl_version }}
        pyghdl=${{ needs.Params.outputs.pyghdl_version }}
        pacghdl=${{ needs.Params.outputs.pacghdl_version }}
      inventory-json:       'inventory.json'
      inventory-version:    ${{ needs.Params.outputs.ghdl_version }}
      inventory-categories: &categories 'application,os-name,os-version,os-arch,runtime,ghdl-backend'
      assets:               &assetList |
        # Artifact Name                        File Name ($/! -> archive with/without subdir)                 Labels                                           Title
        ghdl-macos-15-aarch64-llvm:            $ghdl-llvm-%ghdl%-macos15-aarch64.tar.gz:                      ghdl,macos,15,aarch64,native,llvm:               GHDL - v%ghdl% - macOS 15 (aarch64) - llvm backend
        ghdl-macos-15-aarch64-llvm-jit:        $ghdl-llvm-jit-%ghdl%-macos15-aarch64.tar.gz:                  ghdl,macos,15,aarch64,native,llvm-jit:           GHDL - v%ghdl% - macOS 15 (aarch64) - llvm-jit backend
        ghdl-macos-26-aarch64-llvm:            $ghdl-llvm-%ghdl%-macos26-aarch64.tar.gz:                      ghdl,macos,26,aarch64,native,llvm:               GHDL - v%ghdl% - macOS 26 (aarch64) - llvm backend
        ghdl-macos-26-aarch64-llvm-jit:        $ghdl-llvm-jit-%ghdl%-macos26-aarch64.tar.gz:                  ghdl,macos,26,aarch64,native,llvm-jit:           GHDL - v%ghdl% - macOS 26 (aarch64) - llvm-jit backend
        ghdl-ubuntu-24.04-x86_64-gcc:          $ghdl-gcc-%ghdl%-ubuntu24.04-x86_64.tar.gz:                    ghdl,ubuntu,24.04,x86-64,native,gcc:             GHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - gcc backend
        ghdl-ubuntu-24.04-x86_64-llvm:         $ghdl-llvm-%ghdl%-ubuntu24.04-x86_64.tar.gz:                   ghdl,ubuntu,24.04,x86-64,native,llvm:            GHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - llvm backend
        ghdl-ubuntu-24.04-x86_64-llvm-jit:     $ghdl-llvm-jit-%ghdl%-ubuntu24.04-x86_64.tar.gz:               ghdl,ubuntu,24.04,x86-64,native,llvm-jit:        GHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - llvm-jit backend
        ghdl-ubuntu-24.04-x86_64-mcode:        $ghdl-mcode-%ghdl%-ubuntu24.04-x86_64.tar.gz:                  ghdl,ubuntu,24.04,x86-64,native,mcode:           GHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - mcode backend
        ghdl-ubuntu-26.04-x86_64-gcc:          $ghdl-gcc-%ghdl%-ubuntu26.04-x86_64.tar.gz:                    ghdl,ubuntu,26.04,x86-64,native,gcc:             GHDL - v%ghdl% - Ubuntu 26.04 (x86-64, LTS) - gcc backend
        ghdl-ubuntu-26.04-x86_64-llvm:         $ghdl-llvm-%ghdl%-ubuntu26.04-x86_64.tar.gz:                   ghdl,ubuntu,26.04,x86-64,native,llvm:            GHDL - v%ghdl% - Ubuntu 26.04 (x86-64, LTS) - llvm backend
        ghdl-ubuntu-26.04-x86_64-llvm-jit:     $ghdl-llvm-jit-%ghdl%-ubuntu26.04-x86_64.tar.gz:               ghdl,ubuntu,26.04,x86-64,native,llvm-jit:        GHDL - v%ghdl% - Ubuntu 26.04 (x86-64, LTS) - llvm-jit backend
        ghdl-ubuntu-26.04-x86_64-mcode:        $ghdl-mcode-%ghdl%-ubuntu26.04-x86_64.tar.gz:                  ghdl,ubuntu,26.04,x86-64,native,mcode:           GHDL - v%ghdl% - Ubuntu 26.04 (x86-64, LTS) - mcode backend
        ghdl-Pacman-ucrt64-llvm:                mingw-w64-ucrt-x86_64-ghdl-llvm-%pacghdl%-any.pkg.tar.zst:    ghdl,windows,2025,x86-64,ucrt64,llvm:            GHDL - v%ghdl% - MSYS2/UCRT64 - LLVM backend
        ghdl-Pacman-ucrt64-llvm-jit:            mingw-w64-ucrt-x86_64-ghdl-llvm-jit-%pacghdl%-any.pkg.tar.zst:ghdl,windows,2025,x86-64,ucrt64,llvm-jit:        GHDL - v%ghdl% - MSYS2/UCRT64 - LLVM-JIT backend
        ghdl-Pacman-ucrt64-mcode:               mingw-w64-ucrt-x86_64-ghdl-mcode-%pacghdl%-any.pkg.tar.zst:   ghdl,windows,2025,x86-64,ucrt64,mcode:           GHDL - v%ghdl% - MSYS2/UCRT64 - mcode backend
        ghdl-Windows-ucrt64-mcode:             !ghdl-mcode-%ghdl%-ucrt64.zip:                                 ghdl,windows,2025,x86-64,native,mcode:           GHDL - v%ghdl% - Windows (x86-64, UCRT64, standalone) - mcode backend
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.11: pyghdl-%pyghdl%-cp311-cp311-manylinux_2_38_x86_64.whl:        pyGHDL,ubuntu,24.04,x86-64,py3.11,native,mcode:  pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.11
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.12: pyghdl-%pyghdl%-cp312-cp312-manylinux_2_38_x86_64.whl:        pyGHDL,ubuntu,24.04,x86-64,py3.12,native,mcode:  pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.12
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.13: pyghdl-%pyghdl%-cp313-cp313-manylinux_2_38_x86_64.whl:        pyGHDL,ubuntu,24.04,x86-64,py3.13,native,mcode:  pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.13
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.14: pyghdl-%pyghdl%-cp314-cp314-manylinux_2_38_x86_64.whl:        pyGHDL,ubuntu,24.04,x86-64,py3.14,native,mcode:  pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.14
        pyGHDL-Ubuntu-24.04-x86_64-Python-3.15: pyghdl-%pyghdl%-cp315-cp315-manylinux_2_38_x86_64.whl:        pyGHDL,ubuntu,24.04,x86-64,py3.15,native,mcode:  pyGHDL - v%ghdl% - Ubuntu 24.04 (x86-64, LTS) - Wheel for Python 3.15
        pyGHDL-Windows-x86_64-Python-3.11:      pyghdl-%pyghdl%-cp311-cp311-win_amd64.whl:                    pyGHDL,windows,2025,x86-64,py3.11,native,mcode:  pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.11
        pyGHDL-Windows-x86_64-Python-3.12:      pyghdl-%pyghdl%-cp312-cp312-win_amd64.whl:                    pyGHDL,windows,2025,x86-64,py3.12,native,mcode:  pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.12
        pyGHDL-Windows-x86_64-Python-3.13:      pyghdl-%pyghdl%-cp313-cp313-win_amd64.whl:                    pyGHDL,windows,2025,x86-64,py3.13,native,mcode:  pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.13
        pyGHDL-Windows-x86_64-Python-3.14:      pyghdl-%pyghdl%-cp314-cp314-win_amd64.whl:                    pyGHDL,windows,2025,x86-64,py3.14,native,mcode:  pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.14
        pyGHDL-Windows-x86_64-Python-3.15:      pyghdl-%pyghdl%-cp315-cp315-win_amd64.whl:                    pyGHDL,windows,2025,x86-64,py3.15,native,mcode:  pyGHDL - v%ghdl% - Windows (x86-64) - Wheel for Python 3.15
        pyGHDL-Windows-ucrt64-Python-3.14:      pyghdl-%pyghdl%-cp314-cp314-mingw_x86_64_ucrt_gnu.whl:        pyGHDL,windows,2025,x86-64,py3.14,ucrt64,mcode:  pyGHDL - v%ghdl% - Windows (x86-64) + MSYS2/UCRT64 - Wheel for Python 3.14

  Release:
    uses: pyTooling/Actions/.github/workflows/PublishReleaseNotes.yml@r9
    if: >-
      ${{ !failure() && !cancelled()
       && needs.Params.outputs.is_release_tag == 'true'
      }}
    needs:
      - Params
      - macOS
      - Ubuntu-fast
      - Ubuntu
      - Windows-fast
      - Windows
      - Python
      - PublishToGitHubPages
      - StaticTypeCheck
      - DocCoverage
      - PublishCoverageResults
      - PublishPytestResults
    permissions:
      contents: write
      actions:  write
    with:
      tag:                  ${{ needs.Params.outputs.version }}
      description_file:     '.github/ReleaseDescription.md'
      replacements: |
        ghdl=${{ needs.Params.outputs.ghdl_version }}
        pyghdl=${{ needs.Params.outputs.pyghdl_version }}
        pacghdl=${{ needs.Params.outputs.pacghdl_version }}
      inventory-json:       'inventory.json'
      inventory-version:    ${{ needs.Params.outputs.ghdl_version }}
      inventory-categories: *categories
      assets:               *assetList

  PublishOnPyPI:
    name: 📤 Publish pyGHDL ${{ needs.Params.outputs.pyghdl_version }} on PyPI
    runs-on: ubuntu-26.04
    needs:
      - Params
      - pyGHDL
      - Nightly
      - Release
    if: >-
      ${{ !failure() && !cancelled()
       && github.repository == 'ghdl/ghdl'
       && (needs.Params.outputs.is_release_tag == 'true' || needs.Params.outputs.is_nightly_tag == 'true')
      }}
    environment:
      name: PyPI
      url:  https://pypi.org/project/pyghdl/${{ needs.Params.outputs.pyghdl_version }}/
    permissions:
      id-token: write

    steps:
      - name: 📥 Download wheels '${{ needs.Params.outputs.pyghdl_basename }}-*-Python-*'
        uses: pyTooling/download-artifact@v8
        with:
          pattern:        ${{ needs.Params.outputs.pyghdl_basename }}-*-Python-*
          merge-multiple: true
          path:           dist

      - name: 🔍 Check wheels
        run: |
          ls -lAh dist
          python -m pip install --disable-pip-version-check twine packaging

          python - "${{ needs.Params.outputs.pyghdl_version }}" "${{ needs.Params.outputs.is_release_tag }}" "${{ needs.Params.outputs.version }}" <<'PYEOF'
          import sys
          from pathlib            import Path
          from packaging.utils    import parse_wheel_filename
          from packaging.version  import Version

          expected = Version(sys.argv[1])
          if sys.argv[2] == "true" and Version(sys.argv[3]) != expected:
              print(f"::error title=Version::Release tag '{sys.argv[3]}' doesn't match pyGHDL version '{expected}'.")
              sys.exit(1)

          if len(wheels := list(Path("dist").glob("*.whl"))) == 0:
              print("::error title=Wheels::No wheels downloaded.")
              sys.exit(1)

          errors = 0
          for wheel in wheels:
              _, version, _, tags = parse_wheel_filename(wheel.name)
              platforms = {tag.platform for tag in tags}
              if version != expected:
                  print(f"::error title=Version::Wheel '{wheel.name}' has version '{version}', expected '{expected}'.")
                  errors += 1
              elif all(platform.startswith("mingw_") for platform in platforms):
                  print(f"::notice title=Platform::Wheel '{wheel.name}' is not uploaded: PyPI doesn't accept platform tags {sorted(platforms)}.")
                  wheel.unlink()
              elif not all(platform.startswith("manylinux") or platform == "win_amd64" for platform in platforms):
                  print(f"::error title=Platform::Wheel '{wheel.name}' has platform tags {sorted(platforms)} not accepted by PyPI.")
                  errors += 1
              else:
                  print(f"OK  {wheel.name}")

          sys.exit(1 if errors > 0 else 0)
          PYEOF

          twine check --strict dist/*.whl

      - name: 📤 Upload wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir:  dist/
          skip-existing: true

  Test-SetupGHDL:
#    name: ${{ matrix.icon }} Setup GHDL ${{ matrix.backend }} on ${{ matrix.os_name }}
    uses: ./.github/workflows/Test-SetupGHDL.yml
    needs:
      - Params
      - Nightly
      - Release
    strategy:
      fail-fast: false
      matrix:
        include:
#         - {icon: '🐧',   name: 'Ubuntu',  image: 'ubuntu-20.04', runtime: '',        backend: 'mcode'}
#         - {icon: '🐧',   name: 'Ubuntu',  image: 'ubuntu-24.04', runtime: '',        backend: 'xcode'}
          - {icon: '🐧',   name: 'Ubuntu',  image: 'ubuntu-24.04', runtime: '',        backend: 'mcode'}
          - {icon: '🐧',   name: 'Ubuntu',  image: 'ubuntu-24.04', runtime: '',        backend: 'llvm'}
          - {icon: '🐧',   name: 'Ubuntu',  image: 'ubuntu-24.04', runtime: '',        backend: 'llvm-jit'}
          - {icon: '🐧',   name: 'Ubuntu',  image: 'ubuntu-24.04', runtime: '',        backend: 'gcc'}
          - {icon: '🐧',   name: 'Ubuntu',  image: 'ubuntu-26.04', runtime: '',        backend: 'mcode'}
          - {icon: '🐧',   name: 'Ubuntu',  image: 'ubuntu-26.04', runtime: '',        backend: 'llvm'}
          - {icon: '🐧',   name: 'Ubuntu',  image: 'ubuntu-26.04', runtime: '',        backend: 'llvm-jit'}
          - {icon: '🐧',   name: 'Ubuntu',  image: 'ubuntu-26.04', runtime: '',        backend: 'gcc'}
          - {icon: '🍏',   name: 'macOS',   image: 'macos-15',     runtime: '',        backend: 'llvm'}
          - {icon: '🍏',   name: 'macOS',   image: 'macos-15',     runtime: '',        backend: 'llvm-jit'}
          - {icon: '🍏',   name: 'macOS',   image: 'macos-26',     runtime: '',        backend: 'llvm'}
          - {icon: '🍏',   name: 'macOS',   image: 'macos-26',     runtime: '',        backend: 'llvm-jit'}
          - {icon: '🪟',   name: 'Windows', image: 'windows-2025', runtime: '',        backend: 'mcode'}
          - {icon: '🪟🟨', name: 'Windows', image: 'windows-2025', runtime: 'ucrt64',  backend: 'mcode'}
          - {icon: '🪟🟨', name: 'Windows', image: 'windows-2025', runtime: 'ucrt64',  backend: 'llvm'}
          - {icon: '🪟🟨', name: 'Windows', image: 'windows-2025', runtime: 'ucrt64',  backend: 'llvm-jit'}
    if: >-
      ${{ !failure() && !cancelled()
       && (needs.Params.outputs.is_release_tag == 'true'
        || needs.Params.outputs.is_nightly_tag == 'true'
        || needs.Params.outputs.is_test_tag == 'true')
      }}
    with:
      os_image:              ${{ matrix.image }}
      os_name:               ${{ matrix.name }}
      ghdl_version:          ${{ needs.Params.outputs.setup_version }}
      ghdl_backend:          ${{ matrix.backend }}
      runtime:               ${{ matrix.runtime }}
      expected_ghdl_version: ${{ needs.Params.outputs.ghdl_version }}
